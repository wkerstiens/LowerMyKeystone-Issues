name: Bug report
description: Something is wrong or broken
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Addon version
      description: Shown in the AddOns list on the character-select screen.
    validations:
      required: true
  - type: input
    id: levels
    attributes:
      label: Keystone level before and after, and levels requested
      description: For example "+12 before, asked for 3, +11 after".
  - type: textarea
    id: dialogue
    attributes:
      label: What did Lindormi's dialogue do after each level?
      description: Goodbye page, closed, a confirmation popup, nothing?
  - type: dropdown
    id: continue
    attributes:
      label: How did you reopen the dialogue between levels?
      options:
        - "Target button, then right-click Lindormi"
        - "Interact key (/lowerkey key)"
        - "Other"
        - "Not applicable"
  - type: textarea
    id: debug
    attributes:
      label: "/lowerkey debug output"
      description: Run it with Lindormi's dialogue open. For a run that misbehaves, run /lowerkey debug on first and paste the chat lines. Remove anything you would rather not share.
      render: text
  - type: textarea
    id: error
    attributes:
      label: Lua error text
      description: If there was an error popup, paste it here.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
